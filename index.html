<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
</head>
<body style="font-family: Arial; background: #0f172a; color: white; padding: 20px;">
    <h1>AI Video Generator</h1>
    <p>Загрузка...</p>
    
    <input type="file" id="fileInput" accept="image/*" style="margin: 10px 0;">
    <br>
    <input type="password" id="apiKey" placeholder="Hugging Face Token" style="width: 300px; padding: 8px; margin: 10px 0;">
    <br>
    <button onclick="generate()" style="padding: 12px 24px; background: #8b5cf6; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 10px 0;">Генерировать</button>
    
    <div id="status" style="margin: 15px 0;"></div>
    <video id="video" controls style="max-width: 100%; display: none;"></video>

    <script>
        console.log('Скрипт загружен');
        
        async function generate() {
            const file = document.getElementById('fileInput').files[0];
            const apiKey = document.getElementById('apiKey').value.trim();
            const status = document.getElementById('status');
            const video = document.getElementById('video');

            console.log('Начинаем генерацию');

            if (!file) {
                status.innerHTML = 'Выбери фото';
                return;
            }
            if (!apiKey) {
                status.innerHTML = 'Введи токен';
                return;
            }

            status.innerHTML = 'Генерация...';
            video.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('inputs', file);

                const response = await fetch(
                    'https://api-inference.huggingface.co/models/stabilityai/stable-video-diffusion-img2vid',
                    {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + apiKey },
                        body: formData
                    }
                );

                console.log('Статус ответа:', response.status);

                if (!response.ok) {
                    throw new Error('Ошибка: ' + response.status);
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                video.src = url;
                video.style.display = 'block';
                status.innerHTML = 'Готово!';

            } catch (error) {
                console.error(error);
                status.innerHTML = 'Ошибка: ' + error.message;
            }
        }
    </script>
</body>
</html>
