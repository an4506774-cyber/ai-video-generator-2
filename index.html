<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: white; padding: 20px; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 20px; background: linear-gradient(90deg, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #334155; }
        
        input[type="file"] { display: none; }
        .upload-btn { display: block; width: 100%; padding: 12px; background: #334155; border-radius: 8px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; box-sizing: border-box; }
        .upload-btn:hover { background: #475569; }
        .upload-btn.has-file { background: #10b981; color: white; }
        
        input[type="password"] { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; box-sizing: border-box; margin-bottom: 10px; }
        
        button.gen-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #8b5cf6, #ec4899); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button.gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #status { margin-top: 15px; font-size: 14px; min-height: 20px; word-wrap: break-word; line-height: 1.4; }
        video { width: 100%; border-radius: 8px; margin-top: 15px; background: black; display: none; }
        .download-link { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #10b981; color: white; text-decoration: none; border-radius: 6px; font-size: 14px; }
        
        .proxy-check { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 14px; color: #94a3b8; justify-content: center; }
        .proxy-check input { width: 18px; height: 18px; accent-color: #8b5cf6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ AI Video Generator</h1>
        
        <div class="card">
            <label class="upload-btn" id="uploadLabel">
                📷 Выбери фото
                <input type="file" id="fileInput" accept="image/*">
            </label>
            
            <input type="password" id="apiKey" placeholder="Вставь токен Hugging Face (hf_...)">
            <div style="font-size: 12px; color: #94a3b8; margin-bottom: 10px; text-align: left;">Токен сохранится автоматически</div>
            
            <div class="proxy-check">
                <input type="checkbox" id="useProxy" checked>
                <label for="useProxy">Использовать CORS-прокси (обязательно)</label>
            </div>
            
            <button class="gen-btn" id="genBtn" onclick="generate()">🎬 Сгенерировать видео</button>
        </div>

        <div id="status"></div>
        <video id="video" controls playsinline loop></video>
        <a id="downloadLink" class="download-link" style="display:none">💾 Скачать видео</a>
    </div>

    <script>
        const savedToken = localStorage.getItem('hf_token');
        if (savedToken) document.getElementById('apiKey').value = savedToken;

        const fileInput = document.getElementById('fileInput');
        const uploadLabel = document.getElementById('uploadLabel');
        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                uploadLabel.textContent = `✅ ${selectedFile.name}`;
                uploadLabel.classList.add('has-file');
            }
        });

        async function generate() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const useProxy = document.getElementById('useProxy').checked;
            const status = document.getElementById('status');
            const video = document.getElementById('video');
            const downloadLink = document.getElementById('downloadLink');
            const btn = document.getElementById('genBtn');

            // Проверка токена
            if (!apiKey.startsWith('hf_')) {
                status.textContent = '❌ Токен должен начинаться с "hf_"';
                status.style.color = '#fca5a5';
                return;
            }

            if (apiKey) localStorage.setItem('hf_token', apiKey);
            if (!selectedFile) return alert('Выбери фото!');

            btn.disabled = true;
            status.textContent = '⏳ Генерация... (может занять до 60 сек)';
            status.style.color = '#c4b5fd';
            video.style.display = 'none';
            downloadLink.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('inputs', selectedFile);

                // Используем гарантированно открытую модель
                let targetUrl = 'https://api-inference.huggingface.co/models/damo-vilab/text-to-video-ms-1.7b';
                
                if (useProxy) {
                    targetUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);
                }

                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${apiKey}` },
                    body: formData
                });

                if (!response.ok) {
                    if (response.status === 503) throw new Error('Модель загружается. Подожди 30с и повтори.');
                    if (response.status === 401) throw new Error('Неверный токен. Создай новый типа Read.');
                    if (response.status === 403) throw new Error('Доступ запрещен. Убедись, что email подтвержден.');
                    throw new Error(`Ошибка API: ${response.status}`);
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                video.src = url;
                video.style.display = 'block';
                downloadLink.href = url;
                downloadLink.download = `video-${Date.now()}.mp4`;
                downloadLink.style.display = 'inline-block';
                
                status.textContent = '✅ Готово!';
                status.style.color = '#6ee7b7';

            } catch (err) {
                status.textContent = `❌ ${err.message}`;
                status.style.color = '#fca5a5';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
